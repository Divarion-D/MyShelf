<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-label="Old City Rain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#e05656"/>
      <stop offset="52%" stop-color="#7a1f1f"/>
      <stop offset="100%" stop-color="#2a1113"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0%" stop-color="#ff9d9d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff9d9d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1080" rx="40" fill="url(#bg)"/>
  <rect width="720" height="1080" rx="40" fill="url(#glow)"/>

  <!-- Watermark icon -->
  <g opacity="0.09" transform="translate(360,352) scale(2.35) translate(-360,-430)">
    <rect x="270" y="392" width="180" height="122" rx="14" fill="none" stroke="#ffffff" stroke-width="10"/>
    <g transform="rotate(-8 360 372)">
      <rect x="270" y="352" width="180" height="40" rx="8" fill="#ffffff"/>
      <g fill="#000000" fill-opacity="0.55">
        <path d="M290 352 L306 392 L322 392 L306 352 Z"/><path d="M330 352 L346 392 L362 392 L346 352 Z"/>
        <path d="M370 352 L386 392 L402 392 L386 352 Z"/><path d="M410 352 L426 392 L442 392 L426 352 Z"/>
      </g>
    </g>
    <path d="M336 424 L336 482 L390 453 Z" fill="#ffffff"/>
  </g>

  <!-- Category kicker -->
  <text x="56" y="118" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffffff" fill-opacity="0.72">MOVIE</text>
  

  <!-- Bottom fade -->
  <rect x="0" y="640" width="720" height="440" fill="url(#fade)"/>

  <!-- Media-type pill -->
  <rect x="56" y="740" width="105" height="40" rx="20" fill="#ffffff" fill-opacity="0.16"/>
  <text x="108.5" y="767" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#ffffff">Movie</text>

  <!-- Title -->
  <rect x="56" y="798" width="8" height="66" rx="4" fill="#ffb3b3"/>
  <text x="80" y="856" font-family="'Segoe UI',Arial,sans-serif" font-size="66" font-weight="800" fill="#ffffff">Old City Rain</text>

  <!-- Footer -->
  <text x="56" y="968" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" fill="#ffffff" fill-opacity="0.85">2026-03-09</text>
  <text x="56" y="1004" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.55">#940003</text>
  <text x="664" y="1004" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#ffffff" fill-opacity="0.6">MYSHELF</text>
