<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-label="Moon Parade">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="52%" stop-color="#ff7f50"/>
      <stop offset="100%" stop-color="#3a1d18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0%" stop-color="#ffd08a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1080" rx="40" fill="url(#bg)"/>
  <rect width="720" height="1080" rx="40" fill="url(#glow)"/>

  <!-- Watermark icon -->
  <g opacity="0.09" transform="translate(360,352) scale(2.35) translate(-360,-430)">
    <g stroke="#ffffff" stroke-width="9" stroke-linecap="round">
      <line x1="360" y1="330" x2="360" y2="362"/><line x1="360" y1="498" x2="360" y2="530"/>
      <line x1="260" y1="430" x2="292" y2="430"/><line x1="428" y1="430" x2="460" y2="430"/>
      <line x1="289" y1="359" x2="312" y2="382"/><line x1="408" y1="478" x2="431" y2="501"/>
      <line x1="289" y1="501" x2="312" y2="478"/><line x1="408" y1="382" x2="431" y2="359"/>
    </g>
    <circle cx="360" cy="430" r="56" fill="none" stroke="#ffffff" stroke-width="10"/>
    <circle cx="342" cy="418" r="7" fill="#ffffff"/><circle cx="378" cy="418" r="7" fill="#ffffff"/>
    <path d="M338 444 Q360 466 382 444" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Category kicker -->
  <text x="56" y="118" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffffff" fill-opacity="0.72">CARTOON</text>
  

  <!-- Bottom fade -->
  <rect x="0" y="640" width="720" height="440" fill="url(#fade)"/>

  <!-- Media-type pill -->
  <rect x="56" y="740" width="131" height="40" rx="20" fill="#ffffff" fill-opacity="0.16"/>
  <text x="121.5" y="767" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#ffffff">Cartoon</text>

  <!-- Title -->
  <rect x="56" y="798" width="8" height="66" rx="4" fill="#ffd9a0"/>
  <text x="80" y="856" font-family="'Segoe UI',Arial,sans-serif" font-size="66" font-weight="800" fill="#ffffff">Moon Parade</text>

  <!-- Footer -->
  <text x="56" y="968" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" fill="#ffffff" fill-opacity="0.85">2026-05-27</text>
  <text x="56" y="1004" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.55">#920005</text>
  <text x="664" y="1004" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#ffffff" fill-opacity="0.6">MYSHELF</text>
</svg>
