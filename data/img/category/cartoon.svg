<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-label="CARTOONS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="52%" stop-color="#ff7f50"/>
      <stop offset="100%" stop-color="#3a1d18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#ffd08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1080" rx="40" fill="url(#bg)"/>
  <rect width="720" height="1080" rx="40" fill="url(#glow)"/>

  <!-- Decorative rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <circle cx="360" cy="430" r="210"/>
    <circle cx="360" cy="430" r="300"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.10">
    <circle cx="130" cy="250" r="6"/>
    <circle cx="600" cy="210" r="9"/>
    <circle cx="620" cy="620" r="6"/>
    <circle cx="110" cy="640" r="8"/>
  </g>

  <!-- Brand kicker -->
  <text x="360" y="150" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="26" font-weight="700" letter-spacing="10" fill="#ffffff" fill-opacity="0.75">MYSHELF</text>

  <!-- Icon badge -->
  <rect x="222" y="292" width="276" height="276" rx="62" fill="url(#badge)"
        stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round">
      <line x1="360" y1="330" x2="360" y2="362"/>
      <line x1="360" y1="498" x2="360" y2="530"/>
      <line x1="260" y1="430" x2="292" y2="430"/>
      <line x1="428" y1="430" x2="460" y2="430"/>
      <line x1="289" y1="359" x2="312" y2="382"/>
      <line x1="408" y1="478" x2="431" y2="501"/>
      <line x1="289" y1="501" x2="312" y2="478"/>
      <line x1="408" y1="382" x2="431" y2="359"/>
    </g>
    <circle cx="360" cy="430" r="56" fill="none" stroke="#ffffff" stroke-width="10"/>
    <circle cx="342" cy="418" r="7" fill="#ffffff"/>
    <circle cx="378" cy="418" r="7" fill="#ffffff"/>
    <path d="M338 444 Q360 466 382 444" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Category name -->
  <text x="360" y="760" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="78" font-weight="800" fill="#ffffff">CARTOONS</text>
  <rect x="312" y="800" width="96" height="7" rx="3.5" fill="#ffd9a0"/>

  <!-- Footer -->
  <text x="360" y="1002" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="22" font-weight="600" letter-spacing="6" fill="#ffffff" fill-opacity="0.55">LIBRARY</text>
</svg>
