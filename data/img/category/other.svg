  <path d="M360 336 L384 406 L456 430 L384 454 L360 524 L336 454 L264 430 L336 406 Z" fill="#ffffff"/>
    <path d="M360 336 L384 406 L456 430 L384 454 L360 524 L336 454 L264 430 L336 406 Z" fill="#ffffff" fill-opacity="0.45" transform="rotate(45 360 430)"/>
    <circle cx="360" cy="430" r="20" fill="#ffffff"/>

