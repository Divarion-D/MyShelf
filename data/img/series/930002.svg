<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-label="Silent Port">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#4f7cf0"/>
      <stop offset="52%" stop-color="#2e4482"/>
      <stop offset="100%" stop-color="#141a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0%" stop-color="#8fb0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8fb0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1080" rx="40" fill="url(#bg)"/>
  <rect width="720" height="1080" rx="40" fill="url(#glow)"/>

  <!-- Watermark icon -->
  <g opacity="0.09" transform="translate(360,352) scale(2.35) translate(-360,-430)">
    <rect x="266" y="356" width="188" height="132" rx="18" fill="none" stroke="#ffffff" stroke-width="10"/>
    <path d="M342 396 L342 448 L390 422 Z" fill="#ffffff"/>
    <line x1="330" y1="336" x2="356" y2="356" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <line x1="390" y1="336" x2="364" y2="356" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <rect x="316" y="500" width="88" height="14" rx="7" fill="#ffffff"/>
  </g>

  <!-- Category kicker -->
  <text x="56" y="118" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffffff" fill-opacity="0.72">SERIES</text>
  <text x="664" y="118" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" fill="#ffffff" fill-opacity="0.85">#10</text>

  <!-- Bottom fade -->
  <rect x="0" y="640" width="720" height="440" fill="url(#fade)"/>

  <!-- Media-type pill -->
  <rect x="56" y="740" width="118" height="40" rx="20" fill="#ffffff" fill-opacity="0.16"/>
  <text x="115" y="767" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#ffffff">Series</text>

  <!-- Title -->
  <rect x="56" y="798" width="8" height="66" rx="4" fill="#a9c2ff"/>
  <text x="80" y="856" font-family="'Segoe UI',Arial,sans-serif" font-size="66" font-weight="800" fill="#ffffff">Silent Port</text>

  <!-- Footer -->
  <text x="56" y="968" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" fill="#ffffff" fill-opacity="0.85">2026-02-22</text>
  <text x="56" y="1004" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.55">#930002</text>
  <text x="664" y="1004" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#ffffff" fill-opacity="0.6">MYSHELF</text>
</svg>
