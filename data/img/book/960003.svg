<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2b17"/>
      <stop offset="50%" stop-color="#1a5c34"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="1080" rx="36" fill="url(#bg)"/>

  <!-- Clouds -->
  <circle cx="200" cy="180" r="140" fill="white" opacity="0.06" filter="url(#blur)"/>
  <circle cx="520" cy="120" r="160" fill="white" opacity="0.05" filter="url(#blur)"/>

  <!-- Big background number -->
  <text x="360" y="520"
        text-anchor="middle"
        font-size="260"
        font-weight="800"
        fill="rgba(255,255,255,0.05)">
    03
  </text>

  <!-- Title -->
  <text x="60" y="260"
        font-size="72"
        font-weight="800"
        fill="#c8f5d8">
    Borrowed
  </text>
  <text x="60" y="344"
        font-size="72"
        font-weight="800"
        fill="#c8f5d8">
    Fire
  </text>

  <!-- Category -->
  <text x="60" y="120"
        font-size="20"
        font-weight="700"
        letter-spacing="3"
        fill="rgba(255,255,255,0.7)">
    BOOK
  </text>

  <!-- Bottom fade overlay -->
  <rect x="0" y="700" width="720" height="380" fill="url(#fadeBottom)"/>

  <!-- Skyline -->
  <rect x="0" y="760" width="720" height="320" fill="#1a1a2e"/>
  <rect x="80"  y="700" width="40" height="80"  fill="#1a1a2e"/>
  <rect x="140" y="650" width="60" height="130" fill="#1a1a2e"/>
  <rect x="230" y="680" width="50" height="100" fill="#1a1a2e"/>
  <rect x="310" y="620" width="70" height="160" fill="#1a1a2e"/>
  <rect x="420" y="670" width="50" height="110" fill="#1a1a2e"/>
  <rect x="500" y="640" width="60" height="140" fill="#1a1a2e"/>
  <rect x="590" y="690" width="40" height="90"  fill="#1a1a2e"/>

  <!-- Footer -->
  <text x="60" y="960"
        font-size="18"
        font-weight="700"
        fill="white"
        letter-spacing="1.5">
    MYSHELF
  </text>
  <text x="60" y="1000"
        font-size="20"
        fill="rgba(255,255,255,0.85)">
    2026-03-19
  </text>
  <text x="60" y="1035"
        font-size="18"
        fill="rgba(255,255,255,0.6)">
    #960003
  </text>

</svg>