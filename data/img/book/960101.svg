<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-label="The Quiet Meridian">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#38c46a"/>
      <stop offset="52%" stop-color="#1a5c34"/>
      <stop offset="100%" stop-color="#10241a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0%" stop-color="#92e6ad" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#92e6ad" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1080" rx="40" fill="url(#bg)"/>
  <rect width="720" height="1080" rx="40" fill="url(#glow)"/>

  <!-- Watermark icon -->
  <g opacity="0.09" transform="translate(360,352) scale(2.35) translate(-360,-430)">
    <path d="M360 372 C 326 352, 288 352, 262 364 L262 500 C 288 488, 326 488, 360 508" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <path d="M360 372 C 394 352, 432 352, 458 364 L458 500 C 432 488, 394 488, 360 508" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <line x1="360" y1="372" x2="360" y2="508" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Category kicker -->
  <text x="56" y="118" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffffff" fill-opacity="0.72">BOOK</text>
  

  <!-- Bottom fade -->
  <rect x="0" y="640" width="720" height="440" fill="url(#fade)"/>

  <!-- Media-type pill -->
  <rect x="56" y="666" width="92" height="40" rx="20" fill="#ffffff" fill-opacity="0.16"/>
  <text x="102" y="693" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#ffffff">Book</text>

  <!-- Title -->
  <rect x="56" y="724" width="8" height="140" rx="4" fill="#a9edc0"/>
  <text x="80" y="782" font-family="'Segoe UI',Arial,sans-serif" font-size="66" font-weight="800" fill="#ffffff">The Quiet</text>
  <text x="80" y="856" font-family="'Segoe UI',Arial,sans-serif" font-size="66" font-weight="800" fill="#ffffff">Meridian</text>

  <!-- Footer -->
  <text x="56" y="968" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" fill="#ffffff" fill-opacity="0.85">2026-06-05</text>
  <text x="56" y="1004" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.55">#960101</text>
  <text x="664" y="1004" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#ffffff" fill-opacity="0.6">MYSHELF</text>
</svg>
